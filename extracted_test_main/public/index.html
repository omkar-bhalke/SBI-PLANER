<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statement Fetcher</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#16211b;--mute:#667269;--line:#dfe5e0;--accent:#0b6b4f;--warn:#b3402a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#e8efe9;--mute:#93a099;--line:#27342d;--accent:#3fbf93;--warn:#ef8a74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:16px}
h1{font-size:1.4rem;margin:8px 0 0}section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:1rem;margin:0 0 10px}label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit}
button{padding:10px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer;margin-top:12px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.pill{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem}
.code{font:700 2rem/1.2 ui-monospace,monospace;letter-spacing:.15em;margin:8px 0}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}.result{border-left:4px solid var(--accent);padding-left:12px}
.log{max-height:180px;overflow:auto;font:.8rem ui-monospace,monospace;color:var(--mute)}.err{color:var(--warn)}
.hide{display:none}
</style></head><body><main>
<h1>Mini statement fetcher</h1>

<section id="login" class="hide"><h2>Password</h2><input id="pw" type="password" placeholder="App password"><button onclick="savePw()">Enter</button></section>

<section><h2>1. WhatsApp link <span id="st" class="pill">...</span></h2>
 <div id="linkBox">
  <div id="qrBox"></div>
  <p style="color:var(--mute);font-size:.9rem">QR scan karo (WhatsApp → Linked devices), ya code se link karo:</p>
  <div class="row"><input id="phone" placeholder="91XXXXXXXXXX"><button onclick="pair()">Get code</button></div>
  <div id="code" class="code"></div>
 </div>
 <div id="meBox" class="hide">Linked: <b id="me"></b> <button class="ghost" onclick="api('logout')">Unlink</button></div>
</section>

<section><h2>2. Repeat settings</h2>
 <label>Target number</label><input id="target" placeholder="91XXXXXXXXXX">
 <label>Message to send</label><textarea id="text" rows="2">Hi</textarea>
 <label>Repeat every (minutes)</label><input id="interval" type="number" min="1" value="10">
 <button onclick="start()">Start</button><button class="ghost" onclick="api('stop')">Stop</button>
</section>

<section><h2>3. Status <span id="stage" class="pill">idle</span></h2>
 <div id="results"></div>
 <div id="logs" class="log"></div>
</section></main>
<script>
let pass=sessionStorage.getItem('pw')||'';const $=id=>document.getElementById(id);
const labels={sending:'Sending',waiting_menu:'Waiting for menu',waiting_result:'Waiting for statement',done:'Done',error:'Error'};
async function api(p,body){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','x-pass':pass},body:JSON.stringify(body||{})});
 const d=await r.json();if(r.status===401){$('login').classList.remove('hide')}else if(d.error)alert(d.error);return d}
function savePw(){pass=$('pw').value;sessionStorage.setItem('pw',pass);$('login').classList.add('hide');connect()}
function pair(){api('pair',{phone:$('phone').value})}
function start(){api('start',{target:$('target').value,text:$('text').value,intervalMin:$('interval').value})}
function render(s){
 $('st').textContent=s.status;const open=s.status==='open';
 $('linkBox').classList.toggle('hide',open);$('meBox').classList.toggle('hide',!open);$('me').textContent='+'+(s.me||'');
 $('qrBox').innerHTML=s.qr?'<img alt="QR" src="'+s.qr+'" width="220" height="220">':'';
 $('code').textContent=s.pairCode||'';
 $('stage').textContent=s.job?(labels[s.job.stage]||s.job.stage)+' · run '+s.job.runs+(s.job.nextAt?' · next '+new Date(s.job.nextAt).toLocaleTimeString():''):'idle';
 $('results').innerHTML=s.results.map(r=>'<div class="result" style="margin-bottom:12px"><small style="color:var(--mute)">Run #'+r.run+' · '+new Date(r.at).toLocaleString()+'</small><pre>'+r.text.replace(/</g,'&lt;')+'</pre></div>').join('');
 $('logs').innerHTML=s.logs.slice().reverse().map(l=>'<div>'+new Date(l.t).toLocaleTimeString()+' '+l.m.replace(/</g,'&lt;')+'</div>').join('')}
let es;function connect(){if(es)es.close();es=new EventSource('/api/events?p='+encodeURIComponent(pass));
 es.onmessage=e=>render(JSON.parse(e.data));es.onerror=()=>{if(es.readyState===2)$('login').classList.remove('hide')}}
connect();
</script></body></html>
